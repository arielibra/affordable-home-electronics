name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # The address customers see, baked into canonicals, the sitemap and
          # the social cards. Change it here and nowhere else.
          VITE_SITE_URL: https://affordablehomeelectronics.com

      # Applies any new files in app/migrations that have not run yet.
      # Safe to run on every deploy: already-applied migrations are skipped.
      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          # Pinned, and deliberately NOT the newest release: app/bunfig.toml
          # refuses any package published in the last 24 hours as a
          # supply-chain guard, so a brand new wrangler will not install.
          # When bumping this, pick a version at least a couple of days old.
          wranglerVersion: "4.141.0"
          command: d1 migrations apply affordable-home-electronics-db --remote

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          wranglerVersion: "4.141.0"
          command: deploy
